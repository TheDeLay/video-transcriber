[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-transcriber"
version = "0.2.0"
description = "Download a YouTube video, transcribe with Whisper, generate an AI-ready prompt."
readme = "../README.md"
requires-python = ">=3.11"
license = { file = "../LICENSE" }
authors = [
    { name = "John DeLay" },
]
keywords = ["whisper", "transcription", "youtube", "video", "speech-to-text"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: MacOS",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "click>=8.1",
    "openai-whisper>=20240930",
    "yt-dlp>=2024.10.0",
]

[project.scripts]
video-transcribe = "video_transcriber.cli:main"

[project.urls]
Homepage = "https://github.com/TheDeLay/video-transcriber"
Issues = "https://github.com/TheDeLay/video-transcriber/issues"

[tool.hatch.build.targets.wheel]
packages = ["video_transcriber"]
